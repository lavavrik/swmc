# Series hybrid. Control lives in one Lua script (ctrl).
#   Engine            on/off start/stop
#   Engine Throttle   0..1 load (0 = idle)
#
# Two independent RPS pipes — generator T-offs the ENGINE, not the motor:
#   Engine ──┬── Engine Gen clutch ── Generator
#            └── Starter clutch ── Motor ── Drive clutch ── GB ── Wheels
#
# Start: Engine on, throttle 0, gen off, starter clutch 1, motor = Starter
# throttle, drive clutch 0, until RPS ≥ Start RPS. Diesel idle is 5 RPS —
# below that, disconnect starter clutch (except while cranking). Once alive,
# Engine Gen locks. While driving, starter clutch locks so the diesel helps
# the motor (~20 RPS at throttle 1). Charge hold: motors off, regen stays.
#
# Gears: binary GB1–3, hysteresis + clocked shifts (no 1↔8 loop).
#
# Legal ratios: -1:1, 1:1, 6:5, 3:2, 9:5, 2:1, 5:2, 3:1. Flip to invert.
#   GB1 toward motors: 1:1 / 6:5
#   GB2 toward motors: 1:1 / 3:2
#   GB3 away from motors: 2:1 / 1:1
#
# Vehicle schematic: recipes/hybrid-full.md
# Drawn: /hybrid-full-wiring.html
name: Hybrid Full
description: >-
  Series hybrid. Genset on the engine. Starter clutch engine↔motor.
  Lua control. Do not pipe the generator through the starter clutch.
width: 4
length: 6
pins:
  - id: ignition
    dir: in
    signal: onoff
    label: Ignition
    description: Seat key
  - id: seat
    dir: in
    signal: composite
    label: Seat
    description: Seat data — W/S is number ch 2 (W throttle, S brake)
  - id: reverse
    dir: in
    signal: onoff
    label: Reverse
    description: Holds 1st + motor reverse
  - id: ev_mode
    dir: in
    signal: onoff
    label: EV mode
    description: Engine only if battery low or charge hold
  - id: charge_hold
    dir: in
    signal: onoff
    label: Charge hold
    description: Motors off — diesel + regen only
  - id: engine_rps
    dir: in
    signal: number
    label: Engine RPS
    description: Controller RPS (>idle = running)
  - id: battery
    dir: in
    signal: number
    label: Battery
    description: Charge 0..1
  - id: speed
    dir: in
    signal: number
    label: Wheel RPS
    description: Wheel RPS (shift)
  - id: physics
    dir: in
    signal: composite
    label: Physics
    description: Physics sensor — number ch 13 is abs speed m/s
  - id: engine
    dir: out
    signal: onoff
    label: Engine
    description: Controller on/off
  - id: engine_throttle
    dir: out
    signal: number
    label: Engine Throttle
    description: Load 0..1 (0 idle)
  - id: engine_clutch
    dir: out
    signal: number
    label: Starter Clutch
    description: Engine↔motor — crank, then lock while driving if RPS ≥ idle (5)
  - id: drive_clutch
    dir: out
    signal: number
    label: Drive Clutch
    description: Motor→wheels — fades in on throttle/reverse, never ignition alone
  - id: engine_gen
    dir: out
    signal: number
    label: Engine Gen
    description: Engine→generator — locked once RPS ≥ idle, off while starting
  - id: regen
    dir: out
    signal: number
    label: Regen Clutch
    description: Trans gen — brake at speed if battery not full
  - id: brakes
    dir: out
    signal: number
    label: Wheel Brakes
    description: Friction 0..1 — all of the pedal when slow or battery full
  - id: motor
    dir: out
    signal: number
    label: Motor
    description: 0..1, starter until engine RPS hits Start RPS
  - id: reverse_out
    dir: out
    signal: onoff
    label: Motor Reverse
    description: On in reverse
  - id: gb1
    dir: out
    signal: onoff
    label: Gearbox 1
    description: After motor, arrows toward motors, off 1:1, on 6:5, gears 2 4 6 8
  - id: gb2
    dir: out
    signal: onoff
    label: Gearbox 2
    description: 2nd, arrows toward motors, off 1:1, on 3:2, gears 3 4 7 8
  - id: gb3
    dir: out
    signal: onoff
    label: Gearbox 3
    description: Before wheels, arrows away from motors, off 2:1, on 1:1, gears 5-8
  - id: instruments
    dir: out
    signal: composite
    label: Instruments
    description: Dials ch 1 engine RPS, ch 2 speed m/s, ch 3 battery, ch 4 gear
  - id: hud
    dir: out
    signal: video
    label: HUD
    description: Debug overlay — wire to a video screen
nodes:
  - {
      id: charge_throttle,
      type: property.slider,
      name: Charge throttle,
      min: 0,
      max: 1,
      increment: 0.05,
      value: 0.7,
    }
  - {
      id: starter_throttle,
      type: property.slider,
      name: Starter throttle,
      min: 0,
      max: 1,
      increment: 0.05,
      value: 0.4,
    }
  - { id: soc_cut, type: property.number, name: SOC cut, value: 0.15 }
  - { id: soc_low, type: property.number, name: SOC low, value: 0.3 }
  - { id: soc_gen, type: property.number, name: SOC generate, value: 0.75 }
  - { id: soc_full, type: property.number, name: SOC full, value: 0.95 }
  - { id: start_rps, type: property.number, name: Start RPS, value: 3 }
  - { id: idle_rps, type: property.number, name: Idle RPS, value: 5 }
  - { id: shift_step, type: property.number, name: RPS per gear, value: 4 }
  - { id: shift_hyst, type: property.number, name: Shift hyst, value: 1 }
  - { id: brake_blend, type: property.number, name: Brake blend RPS, value: 4 }
  - {
      id: clutch_fade,
      type: property.slider,
      name: Clutch fade,
      min: 0.01,
      max: 0.25,
      increment: 0.01,
      value: 0.05,
    }
  - { id: seat_ws, type: composite.readNumber, channel: 2 }
  - { id: physics_spd, type: composite.readNumber, channel: 13 }
  - { id: packn, type: composite.writeNumber, channel: 1, count: 17 }
  - { id: packb, type: composite.writeOnoff, channel: 1, count: 4 }
  - id: ctrl
    type: data.luaScript
    script: |
      gear = 1
      drive_cl = 0
      gen_cl = 0
      scl_cl = 0
      charging = false
      alive = false
      moving = false
      shift_t = 0
      hud = { mode = '-', soc = 0, rps = 0, gear = 1, thr = 0, brk = 0, mot = 0, scl = 0, dcl = 0, gen = 0, eng = false, hold = false, ev = false, wheel = 0 }
      function towards(cur, target, step)
        local d = target - cur
        if d > step then d = step elseif d < -step then d = -step end
        cur = cur + d
        if cur < 0 then return 0 end
        if cur > 1 then return 1 end
        return cur
      end
      function onTick()
        local ign = input.getBool(1)
        local reverse = input.getBool(2)
        local ev = input.getBool(3)
        local hold = input.getBool(4)
        local rps = input.getNumber(1)
        local soc = input.getNumber(2)
        local wheel = input.getNumber(3)
        local vspd = input.getNumber(4)
        local ws = input.getNumber(5)
        local charge_thr = input.getNumber(6)
        local starter_thr = input.getNumber(7)
        local start_rps = input.getNumber(8)
        local idle_rps = input.getNumber(9)
        local step = input.getNumber(10)
        if step < 0.01 then step = 0.01 end
        local hyst = input.getNumber(11)
        local blend_rps = input.getNumber(12)
        if blend_rps < 0.01 then blend_rps = 0.01 end
        local soc_cut = input.getNumber(13)
        local soc_low = input.getNumber(14)
        local soc_gen = input.getNumber(15)
        local soc_full = input.getNumber(16)
        local fade = input.getNumber(17)
        if fade < 0.01 then fade = 0.05 end
        local throttle = math.max(ws, 0)
        local brake = math.max(-ws, 0)
        local braking = brake > 0.05
        if throttle > 0.08 or reverse then
          moving = true
        elseif throttle < 0.02 and not reverse then
          moving = false
        end
        local driving = moving
        local batt_low = soc < soc_low
        local batt_need = soc <= soc_gen
        local batt_full = soc >= soc_full
        local batt_ok = soc > soc_cut
        if not ign then
          charging = false
        elseif batt_full then
          charging = false
        elseif batt_low or hold or ((not ev) and batt_need) then
          charging = true
        end
        if rps >= idle_rps then
          alive = true
        elseif rps < start_rps then
          alive = false
        end
        local engine_on = ign and (charging or hold or (driving and alive and not ev))
        local cranking = engine_on and (not driving) and (not braking) and rps < start_rps
        -- Rest: lock clutch and motor-crank. Moving: HUD used to say HYBRID
        -- with clutch 0, so the diesel never got torque until you braked
        -- (rest crank). Slip the spinning motor onto the diesel, then open
        -- until idle, then fade to 1 for assist.
        local pull = 0
        if engine_on and rps > idle_rps then
          pull = (rps - idle_rps) / 4
          if pull > 1 then pull = 1 end
        end
        local scl_target = 0
        if cranking then
          scl_target = 1
        elseif engine_on and driving and rps < start_rps then
          scl_target = 0.25
        elseif engine_on and driving then
          scl_target = pull
        end
        if not ign then
          scl_cl = 0
        elseif cranking then
          scl_cl = 1
        else
          scl_cl = towards(scl_cl, scl_target, fade)
        end
        local starter_clutch = scl_cl
        local drive_target = 0
        if ign and driving then
          if hold then
            drive_target = scl_cl
          else
            drive_target = 1
          end
        end
        if not ign then
          drive_cl = 0
        else
          drive_cl = towards(drive_cl, drive_target, fade)
        end
        local gen_target = 0
        local engine_thr = 0
        if engine_on and alive then
          if driving then
            engine_thr = math.max(throttle, 0.55, charge_thr)
            if charging and not batt_full then
              if hold then
                gen_target = 0.2
              else
                -- More gen as RPS rises. The old (1-pull) formula did the
                -- opposite and killed charge at speed.
                gen_target = 0.3 + 0.6 * pull
              end
            end
          else
            gen_target = 1
            if charging and not batt_full then engine_thr = charge_thr end
          end
        end
        if not ign then
          gen_cl = 0
        else
          gen_cl = towards(gen_cl, gen_target, fade)
        end
        local engine_gen = gen_cl
        local motor = 0
        if cranking then
          motor = starter_thr
        elseif ign and batt_ok and not hold then
          if not braking then motor = throttle end
        end
        local reverse_out = reverse and ign and batt_ok
        if (not ign) or reverse then
          gear = 1
          shift_t = 0
        else
          shift_t = shift_t + 1
          if shift_t >= 18 then
            shift_t = 0
            if wheel > gear * step and gear < 8 then
              gear = gear + 1
            elseif wheel < (gear - 1) * step - hyst and gear > 1 then
              gear = gear - 1
            end
          end
        end
        local g = math.floor(gear - 1)
        local regen, brakes = 0, 0
        if ign and braking then
          if batt_full then
            brakes = brake
          else
            local frac = wheel / blend_rps
            if frac < 0 then frac = 0 elseif frac > 1 then frac = 1 end
            regen = brake * frac
            brakes = brake * (1 - frac)
          end
        end
        output.setNumber(1, engine_thr)
        output.setNumber(2, starter_clutch)
        output.setNumber(3, drive_cl)
        output.setNumber(4, engine_gen)
        output.setNumber(5, regen)
        output.setNumber(6, brakes)
        output.setNumber(7, motor)
        output.setNumber(8, gear)
        output.setBool(1, engine_on)
        output.setBool(2, reverse_out)
        output.setBool(3, g % 2 ~= 0)
        output.setBool(4, math.floor(g / 2) % 2 ~= 0)
        output.setBool(5, math.floor(g / 4) % 2 ~= 0)
        local mode = 'OFF'
        if not ign then
          mode = 'OFF'
        elseif hold then
          mode = 'HOLD'
        elseif ev and not engine_on then
          mode = 'EV'
        elseif cranking or (engine_on and driving and rps < start_rps) then
          mode = 'START'
        elseif engine_on and driving then
          mode = 'HYBRID'
        elseif engine_on then
          mode = 'CHARGE'
        else
          mode = 'EV'
        end
        hud = {
          mode = mode, soc = soc, rps = rps, gear = gear, thr = throttle, brk = brake,
          mot = motor, scl = starter_clutch, dcl = drive_cl, gen = engine_gen,
          eng = engine_on, hold = hold, ev = ev, wheel = wheel, alive = alive,
        }
      end
      function onDraw()
        local w = screen.getWidth()
        local h = screen.getHeight()
        local d = hud
        screen.setColor(8, 12, 14)
        screen.drawClear()
        screen.setColor(40, 180, 90)
        screen.drawRectF(0, 0, math.floor(w * math.min(math.max(d.soc, 0), 1)), 4)
        screen.setColor(180, 50, 50)
        screen.drawRectF(0, 5, math.floor(w * math.min(d.rps / 20, 1)), 3)
        screen.setColor(220, 220, 210)
        screen.drawText(1, 10, d.mode)
        screen.drawText(1, 17, string.format('SOC %.2f', d.soc))
        screen.drawText(1, 24, string.format('RPS %.1f', d.rps))
        screen.drawText(1, 31, string.format('G%d  W %.1f', d.gear, d.wheel))
        screen.drawText(1, 38, string.format('M %.2f D %.2f', d.mot, d.dcl))
        screen.drawText(1, 45, string.format('S %.0f GEN %.0f', d.scl, d.gen))
        if d.eng then
          screen.setColor(80, 220, 90)
          screen.drawText(1, 52, 'ENG')
        else
          screen.setColor(120, 120, 120)
          screen.drawText(1, 52, 'eng')
        end
        if d.hold then
          screen.setColor(220, 180, 60)
          screen.drawText(20, 52, 'HOLD')
        end
        if d.ev then
          screen.setColor(80, 160, 220)
          screen.drawText(40, 52, 'EV')
        end
        screen.setColor(60, 70, 74)
        screen.drawRect(0, 0, w - 1, h - 1)
      end
  - { id: out_thr, type: composite.readNumber, channel: 1 }
  - { id: out_sclutch, type: composite.readNumber, channel: 2 }
  - { id: out_drive, type: composite.readNumber, channel: 3 }
  - { id: out_gen, type: composite.readNumber, channel: 4 }
  - { id: out_regen, type: composite.readNumber, channel: 5 }
  - { id: out_brakes, type: composite.readNumber, channel: 6 }
  - { id: out_motor, type: composite.readNumber, channel: 7 }
  - { id: out_gear, type: composite.readNumber, channel: 8 }
  - { id: out_engine, type: composite.readOnoff, channel: 1 }
  - { id: out_rev, type: composite.readOnoff, channel: 2 }
  - { id: out_gb1, type: composite.readOnoff, channel: 3 }
  - { id: out_gb2, type: composite.readOnoff, channel: 4 }
  - { id: out_gb3, type: composite.readOnoff, channel: 5 }
  - { id: inst, type: composite.writeNumber, channel: 1, count: 4 }
  - { id: tip_rps, type: tooltip.number, name: Engine RPS }
  - { id: tip_soc, type: tooltip.number, name: Battery }
  - { id: tip_engine, type: tooltip.onoff, name: Engine, onLabel: run, offLabel: off }
  - { id: tip_regen, type: tooltip.number, name: Regen }
  - { id: tip_gear, type: tooltip.number, name: Gear }
wires:
  - { from: seat, to: seat_ws }
  - { from: physics, to: physics_spd }
  - { from: engine_rps, to: packn.in.1 }
  - { from: battery, to: packn.in.2 }
  - { from: speed, to: packn.in.3 }
  - { from: physics_spd, to: packn.in.4 }
  - { from: seat_ws, to: packn.in.5 }
  - { from: charge_throttle, to: packn.in.6 }
  - { from: starter_throttle, to: packn.in.7 }
  - { from: start_rps, to: packn.in.8 }
  - { from: idle_rps, to: packn.in.9 }
  - { from: shift_step, to: packn.in.10 }
  - { from: shift_hyst, to: packn.in.11 }
  - { from: brake_blend, to: packn.in.12 }
  - { from: soc_cut, to: packn.in.13 }
  - { from: soc_low, to: packn.in.14 }
  - { from: soc_gen, to: packn.in.15 }
  - { from: soc_full, to: packn.in.16 }
  - { from: clutch_fade, to: packn.in.17 }
  - { from: packn, to: packb.composite }
  - { from: ignition, to: packb.in.1 }
  - { from: reverse, to: packb.in.2 }
  - { from: ev_mode, to: packb.in.3 }
  - { from: charge_hold, to: packb.in.4 }
  - { from: packb, to: ctrl.composite }
  - { from: ctrl.composite, to: out_thr }
  - { from: ctrl.composite, to: out_sclutch }
  - { from: ctrl.composite, to: out_drive }
  - { from: ctrl.composite, to: out_gen }
  - { from: ctrl.composite, to: out_regen }
  - { from: ctrl.composite, to: out_brakes }
  - { from: ctrl.composite, to: out_motor }
  - { from: ctrl.composite, to: out_gear }
  - { from: ctrl.composite, to: out_engine }
  - { from: ctrl.composite, to: out_rev }
  - { from: ctrl.composite, to: out_gb1 }
  - { from: ctrl.composite, to: out_gb2 }
  - { from: ctrl.composite, to: out_gb3 }
  - { from: out_thr, to: engine_throttle }
  - { from: out_sclutch, to: engine_clutch }
  - { from: out_drive, to: drive_clutch }
  - { from: out_gen, to: engine_gen }
  - { from: out_regen, to: regen }
  - { from: out_brakes, to: brakes }
  - { from: out_motor, to: motor }
  - { from: out_engine, to: engine }
  - { from: out_rev, to: reverse_out }
  - { from: out_gb1, to: gb1 }
  - { from: out_gb2, to: gb2 }
  - { from: out_gb3, to: gb3 }
  - { from: engine_rps, to: inst.in.1 }
  - { from: physics_spd, to: inst.in.2 }
  - { from: battery, to: inst.in.3 }
  - { from: out_gear, to: inst.in.4 }
  - { from: inst, to: instruments }
  - { from: ctrl.video, to: hud }
  - { from: engine_rps, to: tip_rps.value }
  - { from: battery, to: tip_soc.value }
  - { from: out_engine, to: tip_engine }
  - { from: out_regen, to: tip_regen.value }
  - { from: out_gear, to: tip_gear.value }
